<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up - Rhythm Verse Dance Studio</title>
    
    <style>
        /* Modern geometric font */
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        /* Animated Mesh/Gradient Background */
        body {
            background: linear-gradient(-45deg, #0f0c29, #302b63, #00d2ff, #3a7bd5);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #ffffff;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Ultra-Sleek Glass Card */
        .container {
            background: rgba(20, 20, 30, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 45px 40px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 480px;
            transition: transform 0.4s ease;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        /* High-impact typography */
        h1 { 
            font-size: 32px; 
            font-weight: 900; 
            margin-bottom: 8px; 
            text-align: center; 
            text-transform: uppercase;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        p.subtitle { 
            color: #b0b0c0; 
            font-size: 15px; 
            text-align: center; 
            margin-bottom: 30px; 
        }

        /* Modern input labels */
        label { 
            display: block; 
            color: #e0e0e0; 
            font-weight: 500; 
            margin-bottom: 8px; 
            font-size: 13px; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Sleek, underline-only inputs */
        input[type=text], input[type=tel], input[type=date], select {
            width: 100%; 
            padding: 14px 15px; 
            margin-bottom: 25px;
            background-color: rgba(0, 0, 0, 0.2); 
            border: none;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px 8px 0 0;
            font-size: 15px; 
            color: #ffffff;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        /* Dropdown options need a dark background so they are readable */
        select option {
            background-color: #1a1a2e;
            color: #ffffff;
        }

        /* Neon Glow Focus Effect */
        input[type=text]:focus, input[type=tel]:focus, input[type=date]:focus, select:focus {
            background-color: rgba(0, 0, 0, 0.4); 
            border-bottom: 2px solid #00f2fe;
            outline: none; 
            box-shadow: 0 10px 10px -10px rgba(0, 242, 254, 0.5);
        }

        /* Adjust date picker icon for dark mode in supported browsers */
        ::-webkit-calendar-picker-indicator {
            filter: invert(1);
            opacity: 0.6;
            cursor: pointer;
        }

        /* Button Layout */
        .clearfix { 
            display: flex; 
            justify-content: space-between; 
            gap: 15px; 
            margin-top: 10px; 
        }
        
        button {
            width: 100%; 
            padding: 16px; 
            border: none; 
            border-radius: 50px; /* Pill shape */
            font-size: 15px; 
            font-weight: 700; 
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        
        button:active { transform: translateY(1px); }

        /* Secondary Button (Cancel) */
        .cancelbtn { 
            background-color: transparent; 
            color: #b0b0c0; 
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .cancelbtn:hover { 
            background-color: rgba(255, 255, 255, 0.05); 
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* Primary Neon Button (Register) */
        .signupbtn { 
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #0f0c29; 
            box-shadow: 0 8px 20px rgba(0, 242, 254, 0.3); 
        }
        .signupbtn:hover { 
            box-shadow: 0 12px 25px rgba(0, 242, 254, 0.5);
            transform: translateY(-3px);
            filter: brightness(1.1);
        }

        .terms-text {
            color: #808090;
            font-size: 13px;
            text-align: center;
            margin-top: 5px;
            margin-bottom: 20px;
        }

        a { color: #00f2fe; text-decoration: none; font-weight: 600; }
        a:hover { text-decoration: underline; text-shadow: 0 0 8px rgba(0, 242, 254, 0.5); }

        @media screen and (max-width: 480px) {
            .container { padding: 40px 20px; border-radius: 16px; }
            .clearfix { flex-direction: column; }
            body { align-items: flex-start; }
        }
    </style>
</head>
<body>
    <form action="https://sheetdb.io/api/v1/334jme01cbqzr" method="post" id="registration-form">
        <div class="container">
            <h1>Rhythm Verse</h1>
            <p class="subtitle">Secure your spot for a demo class.</p>
            
            <label for="number">Phone Number</label>
            <input type="tel" id="number" placeholder="Enter your mobile" name="data[number]" required>
      
            <label for="name">Student Name</label>
            <input type="text" id="name" placeholder="Enter your full name" name="data[name]" required>
            
            <label for="date">Registration Date</label>
            <input type="date" id="date" name="data[date]" required>
            
            <label for="batch-time">Select Batch Time</label>
            <select id="batch-time" name="data[batch-time]" required>
                <option value="" disabled selected>Choose a time slot</option>
                <option value="8 to 9AM">8:00 AM to 9:00 AM</option>
                <option value="2 to 3PM">2:00 PM to 3:00 PM</option>
                <option value="4 to 5PM">4:00 PM to 5:00 PM</option>
                <option value="5 to 6PM">5:00 PM to 6:00 PM</option>
                <option value="6 to 7PM">6:00 PM to 7:00 PM</option>
                <option value="7 to 8PM">7:00 PM to 8:00 PM</option>
                <option value="8 to 9PM">8:00 PM to 9:00 PM</option>
                <option value="9 to 10PM">9:00 PM to 10:00 PM</option>
            </select>

            <p class="terms-text">By registering, you agree to our <a href="#">Terms & Privacy</a>.</p>
      
            <div class="clearfix">
                <button type="button" class="cancelbtn" onclick="document.getElementById('registration-form').reset()">Reset</button>
                <button type="submit" class="signupbtn" id="submit-btn">Register Now</button>
            </div>
        </div>
    </form>

    <script>
        const form = document.getElementById('registration-form');
        const submitBtn = document.getElementById('submit-btn');
        
        form.addEventListener("submit", e => {
            e.preventDefault();
            
            // Show processing text
            submitBtn.innerHTML = "PROCESSING...";
            
            fetch(form.action, {
                method : "POST",
                body: new FormData(form),
            })
            .then(response => response.json())
            .then((data) => {
                // Grab the student's name to pass to the next page
                const studentName = document.getElementById('name').value;
                
                // Redirect to your landing page. 
                // Note: Ensure your landing page is named 'landingpg.html' if you are no longer using PHP!
                window.location.href = `landingpg.html?student_name=${encodeURIComponent(studentName)}`;
            })
            .catch((error) => {
                alert("Something went wrong. Please check your connection and try again.");
                console.error('Error:', error);
                submitBtn.innerHTML = "REGISTER NOW"; // Reset button text on error
            });
        });
    </script>
</body>
</html>
